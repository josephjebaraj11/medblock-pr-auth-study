<title>ClearAuth AI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an operations console. Fixed role-shaped sidebar, sticky top bar,
   a scannable work surface, and a right-hand case drawer that shows the agent's waterfall live.
   Palette and faces follow the existing Nexauth web tokens (navy ink, brand blue, aqua,
   "greenlight" green for approvals, signal orange for attention only). */
:root{
  --bg:#F5F8FC; --surface:#FFFFFF; --surface-2:#EEF3F9; --inset:#E8EFF7;
  --fg:#111D2E; --fg-2:#3B5576; --muted:#5E7795; --line:#CFDCEB; --line-2:#E3EAF3;
  --brand:#0B63CE; --brand-ink:#FFFFFF; --brand-tint:#DCEAFE; --brand-tint-fg:#0A4FA6;
  --aqua:#118585; --aqua-tint:#D1F6F3; --aqua-tint-fg:#126A6B;
  --ok:#0D7F40; --ok-tint:#CFF0DD; --ok-tint-fg:#09522A;
  --warn:#B45309; --warn-tint:#FFEDD5; --warn-tint-fg:#8F4309;
  --bad:#B42318; --bad-tint:#FEE4E2; --bad-tint-fg:#912018;
  --sidebar:#111D2E; --sidebar-fg:#CFDCEB; --sidebar-muted:#7793B4; --sidebar-active:#1B2C42;
  --shadow:0 1px 2px rgba(17,29,46,.06),0 8px 24px rgba(17,29,46,.08);
  --f-display:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1322; --surface:#111D2E; --surface-2:#16253A; --inset:#1B2C42;
  --fg:#E8EFF7; --fg-2:#A9BED6; --muted:#8AA2BF; --line:#2A405C; --line-2:#1F324A;
  --brand:#569AF5; --brand-ink:#0A1322; --brand-tint:#10386C; --brand-tint-fg:#BCD8FD;
  --aqua:#35C3C1; --aqua-tint:#0E4546; --aqua-tint-fg:#A6ECE8;
  --ok:#34C77A; --ok-tint:#0B3A20; --ok-tint-fg:#A2E2BE;
  --warn:#F0A04B; --warn-tint:#43260A; --warn-tint-fg:#FFD2A6;
  --bad:#F97066; --bad-tint:#4A1512; --bad-tint-fg:#FECDCA;
  --sidebar:#070E19; --sidebar-fg:#CFDCEB; --sidebar-muted:#7793B4; --sidebar-active:#16253A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111D2E; --surface-2:#16253A; --inset:#1B2C42;
  --fg:#E8EFF7; --fg-2:#A9BED6; --muted:#8AA2BF; --line:#2A405C; --line-2:#1F324A;
  --brand:#569AF5; --brand-ink:#0A1322; --brand-tint:#10386C; --brand-tint-fg:#BCD8FD;
  --aqua:#35C3C1; --aqua-tint:#0E4546; --aqua-tint-fg:#A6ECE8;
  --ok:#34C77A; --ok-tint:#0B3A20; --ok-tint-fg:#A2E2BE;
  --warn:#F0A04B; --warn-tint:#43260A; --warn-tint-fg:#FFD2A6;
  --bad:#F97066; --bad-tint:#4A1512; --bad-tint-fg:#FECDCA;
  --sidebar:#070E19; --sidebar-fg:#CFDCEB; --sidebar-muted:#7793B4; --sidebar-active:#16253A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--sidebar);color:var(--sidebar-fg);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandmark{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brandmark svg{flex:none}
.brandmark b{font-family:var(--f-display);font-size:19px;font-weight:600;color:#FFFFFF;letter-spacing:-.01em}
.brandmark small{display:block;font-size:11px;color:var(--sidebar-muted);letter-spacing:.04em}
.navs{display:flex;flex-direction:column;gap:18px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--sidebar-muted);padding:0 10px 6px;font-weight:600}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--sidebar-fg);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.navbtn:hover{background:var(--sidebar-active)}
.navbtn[aria-current="page"]{background:var(--sidebar-active);color:#FFFFFF;box-shadow:inset 2px 0 0 #569AF5}
.navbtn .count{font-size:11px;background:#B45309;color:#FFFFFF;border-radius:10px;padding:0 7px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--sidebar-muted);padding:0 10px;line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;flex-wrap:wrap}
.tenant{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.tenant b{font-size:14px}
.tenant span{font-size:12px;color:var(--muted)}
.whois{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.whois label{font-size:12px;color:var(--muted)}
.select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;max-width:100%}
.iconbtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:-6px;right:-6px;background:var(--warn);color:#FFFFFF;font-size:10.5px;border-radius:9px;padding:0 5px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}

.content{padding-block:24px 64px;padding-inline:24px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead h1{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.015em;line-height:1.15}
.pagehead p{color:var(--fg-2);margin-top:4px;max-width:68ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h2{font-size:15px;font-weight:600}
.panel-h p{font-size:12.5px;color:var(--muted)}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{overflow-wrap:anywhere;font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.attn .v{color:var(--warn)}
.kpi.good .v{color:var(--ok)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td.mono{white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td .sub{display:block;font-size:12px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-tint);color:var(--ok-tint-fg)}
.p-warn{background:var(--warn-tint);color:var(--warn-tint-fg)}
.p-bad{background:var(--bad-tint);color:var(--bad-tint-fg)}
.p-info{background:var(--brand-tint);color:var(--brand-tint-fg)}
.p-aqua{background:var(--aqua-tint);color:var(--aqua-tint-fg)}
.p-mute{background:var(--inset);color:var(--fg-2)}
.p-live::before{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--inset);color:var(--fg-2);font-family:var(--f-mono)}
.tag.phi{background:var(--bad-tint);color:var(--bad-tint-fg)}
.tag.cfg{background:var(--brand-tint);color:var(--brand-tint-fg)}
.tag.sec{background:var(--warn-tint);color:var(--warn-tint-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
:root[data-theme="dark"] .btn.go{color:#04170C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.go{color:#04170C}}
.btn.danger{color:var(--bad);border-color:var(--bad-tint)}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{padding:11px 18px;font-size:14px;font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--fg-2)}
.input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;width:100%}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-tint);color:var(--warn-tint-fg);border-color:transparent}
.banner.info{background:var(--brand-tint);color:var(--brand-tint-fg);border-color:transparent}
.banner.ok{background:var(--ok-tint);color:var(--ok-tint-fg);border-color:transparent}
.banner b{font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* channel mix bar */
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--inset)}
.mix span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,19,34,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.drawer-h h2{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.2}
.drawer-b{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px}
.close{margin-left:auto}

/* waterfall stage tracker */
.stages{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.stage{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);min-width:0}
.stage .bar{height:6px;border-radius:3px;background:var(--inset)}
.stage.done .bar{background:var(--aqua)}
.stage.now .bar{background:var(--brand);animation:pulse 1.1s ease-in-out infinite}
.stage.stop .bar{background:var(--warn)}
.stage.fail .bar{background:var(--bad)}
.stage.done,.stage.now{color:var(--fg)}
.channels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ch{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-size:12px;min-width:0}
.ch b{display:block;font-size:12.5px}
.ch.used{border-color:var(--aqua);box-shadow:inset 0 0 0 1px var(--aqua)}
.ch.failed{border-color:var(--bad-tint)}
.ch.skip{opacity:.55}
.ch .st{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fact{min-width:0}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fact .v{font-size:13.5px;overflow-wrap:anywhere}
.outcome{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.outcome.ok{background:var(--ok-tint);color:var(--ok-tint-fg);border-color:transparent}
.outcome.warn{background:var(--warn-tint);color:var(--warn-tint-fg);border-color:transparent}
.outcome.bad{background:var(--bad-tint);color:var(--bad-tint-fg);border-color:transparent}
.outcome.info{background:var(--brand-tint);color:var(--brand-tint-fg);border-color:transparent}
.outcome .big{font-size:17px;font-weight:600;letter-spacing:-.01em}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:62px 18px minmax(0,1fr);gap:8px;font-size:13px;padding-bottom:12px;position:relative}
.tl .t{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.tl .m{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--line);justify-self:center;position:relative;z-index:1}
.tl::after{content:"";position:absolute;left:79px;top:16px;bottom:-2px;width:1px;background:var(--line-2)}
.tl:last-child::after{display:none}
.tl.agent .m{background:var(--aqua)}
.tl.user .m{background:var(--brand)}
.tl.warn .m{background:var(--warn)}
.tl.ok .m{background:var(--ok)}
.tl .who{font-size:11.5px;color:var(--muted)}
.tl .ref{font-family:var(--f-mono);font-size:11.5px;color:var(--fg-2)}
.doclist{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:13px;flex-wrap:wrap}
.transcript{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.transcript b{font-weight:600}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
/* notifications */
.npanel{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:30;text-align:left}
.nitem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:10px 14px;cursor:pointer;font-size:13px}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{box-shadow:inset 3px 0 0 var(--brand)}
.nitem span{display:block;font-size:11.5px;color:var(--muted)}

/* blueprint */
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:stretch}
.layer .ln{font-size:12px;font-weight:600;color:var(--fg-2);padding:10px 0;border-top:2px solid var(--line)}
.layer .ln small{display:block;font-weight:400;color:var(--muted)}
.boxes{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.box{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:12.5px;min-width:0}
.box small{display:block;color:var(--muted);font-size:11.5px}
.box.ext{border-style:dashed;background:transparent}
.box.core{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.entities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.entity{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.entity h3{font-size:13.5px;font-family:var(--f-mono);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:8px;align-items:center}
.entity ul{list-style:none;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:3px;font-size:12px;font-family:var(--f-mono)}
.entity li{display:flex;justify-content:space-between;gap:8px}
.entity li em{font-style:normal;color:var(--muted)}
.entity .foot{margin-top:auto;padding:8px 12px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
pre.json{margin:0;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:12px;overflow:auto;max-height:420px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .s{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.flow .a{color:var(--muted)}
.phases{display:flex;flex-direction:column;gap:10px}
.phase{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;border-top:1px solid var(--line);padding-top:12px}
.phase h3{font-size:14px}
.phase .when{font-size:12px;color:var(--muted)}
.phase ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.check{color:var(--ok);font-weight:700}
.dash{color:var(--line)}
.slider{width:100%;accent-color:var(--brand)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{width:36px;height:20px;accent-color:var(--bad)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--inset);color:var(--muted)}
.steps span.done{background:var(--aqua-tint);color:var(--aqua-tint-fg)}
.steps span.now{background:var(--brand-tint);color:var(--brand-tint-fg);font-weight:600}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;min-width:280px}
.track span{font-size:11px;text-align:center;padding:3px 4px;border-radius:4px;background:var(--inset);color:var(--muted)}
.track span.done{background:var(--aqua-tint);color:var(--aqua-tint-fg)}
.track span.now{background:var(--brand);color:var(--brand-ink);font-weight:600}
.track span.stuck{background:var(--warn-tint);color:var(--warn-tint-fg);font-weight:600}

  if(c.state==='NO_AUTH_REQUIRED') return {label:'No authorization required', cls:'p-aqua', group:'done'};

  if(c.state==='APPROVED') return {label:'Approved', cls:'p-ok', group:'done'};
  if(c.state==='PARTIAL') return {label:'Partially approved', cls:'p-ok', group:'done'};
  if(c.state==='CLINICAL_REVIEW') return {label:'Clinical review required', cls:'p-warn', group:'clinical'};
  if(c.state==='NEEDS_APPROVAL') return {label:'Needs approval', cls:'p-warn', group:'staff'};
  if(c.state==='ADMIN_EXCEPTION') return {label:'Admin exception', cls:'p-warn', group:'staff'};
  if(c.state==='DENIED') return {label:'Denied – appeal prep', cls:'p-bad', group:'clinical'};

  return {label:c.state, cls:'p-mute', group:'other'};
}

/* ---------------- The agent pipeline (simulated) ---------------- */
const STAGES = ['Intake','Eligibility','PA required?','Packet','Decision','Submit','Outcome'];
function stageIndex(c){
  return ({RECEIVED:0,ELIGIBILITY:1,ADMIN_EXCEPTION:1,REQUIREMENT_CHECK:2,NO_AUTH_REQUIRED:6,DOCUMENTATION:3,CLINICAL_REVIEW:3,DECISION:4,NEEDS_APPROVAL:4,SUBMITTING:5,SUBMITTED:5,PENDED:5,APPROVED:6,PARTIAL:6,DENIED:6,APPEAL_SUBMITTED:6,P2P_SCHEDULED:6,WITHDRAWN:6})[c.state] ?? 0;
}
async function tick(ms){ await sleep(ms||650); render(); }

async function runCase(c, from){
  c.live = true; render();
  const p = patient(c.patientId), payer = PAYERS[c.payer], rule = RULES[c.payer][c.cpt], proc = PROC[c.cpt];
  if(from==='intake'){
    setState(c,'RECEIVED'); ev(c,'agent','Orchestrator','Case opened from GET AUTHORIZATION · packet complete enough to act on', c.idem); await tick();
    setState(c,'ELIGIBILITY'); await tick();
    if(!p.active){
      ev(c,'agent','Coverage','X12 270/271: coverage INACTIVE for date of service','271 TRN 8841-'+rnd(4));
      setState(c,'ADMIN_EXCEPTION'); c.exception='Coverage inactive on 271 response. Confirm current insurance with the patient.';
      ev(c,'agent','Orchestrator','Administrative exception → operations queue'); notify(['staff'],'An administrative exception needs attention', c.id);
      c.live=false; render(); return;
    }
    ev(c,'agent','Coverage','X12 270/271: coverage active · '+payer.name+' '+payer.plan,'271 TRN 8841-'+rnd(4)); await tick();
    setState(c,'REQUIREMENT_CHECK'); await tick();
    const via = payer.routes.includes('FHIR PAS') ? 'Da Vinci CRD' : payer.electronic ? 'Availity auth-required lookup' : 'Payer requirement matrix '+rule.version;
    if(!rule.req){
      ev(c,'agent','Coverage',via+': no authorization required for '+c.cpt, (via.startsWith('Da')?'CRD card ':'AV-REQ-')+rnd(5));
      setState(c,'NO_AUTH_REQUIRED');
      ev(c,'agent','Follow-Up','Written back to EHR: not required · source, date and reference logged','DocRef wb-'+c.id.slice(3));
      notify(['physician'],'An order needs no authorization — logged to the chart', c.id);
      c.live=false; render(); return;
    }
    ev(c,'agent','Coverage',via+': PA required · '+rule.docs.length+' documents requested', (via.startsWith('Da')?'CRD card ':'AV-REQ-')+rnd(5)); await tick();
    setState(c,'DOCUMENTATION');
    c.docs = rule.docs.map(d=>D(d,'attached'));
    await tick(400);
    const missing = proc.needsConservative && !p.therapy;
    if(missing){
      c.docs.forEach(d=>{ if(d.name.startsWith('Conservative')) d.status='missing'; });
      c.findings=['No conservative-therapy documentation in the last 90 days. '+payer.name+' policy requires 6 weeks of PT, chiropractic or medication trial before '+proc.short+'.','No red-flag symptoms documented that would waive the requirement.'];
      ev(c,'agent','Clinical','DTR auto-fill: '+(rule.docs.length-1)+' of '+rule.docs.length+' documents found · conservative therapy record missing','DTR QR-'+c.id.slice(3));
      c.confidence = 0.58; setState(c,'CLINICAL_REVIEW');
      ev(c,'agent','Orchestrator','Flagged CLINICAL REVIEW REQUIRED · the agent does not decide medical necessity');
      notify(['clinical'],'A case needs clinical review', c.id); notify(['physician'],'An order is waiting on clinical review', c.id);
      c.live=false; render(); return;
    }
    ev(c,'agent','Clinical + Compliance','DTR auto-fill: '+rule.docs.length+' of '+rule.docs.length+' documents · minimum-necessary check passed','DTR QR-'+c.id.slice(3)); await tick();
  }
  if(from==='intake' || from==='decision'){
    setState(c,'DECISION'); await tick();
    c.confidence = c.confidence && c.confidence>0.8 ? c.confidence : (payer.electronic ? 0.93 : 0.87) + (from==='decision'? -0.01:0);
    const mode = S.policy.trust[c.payer];
    const gate = S.policy.killSwitch ? 'kill switch is on' : mode==='shadow' ? payer.name+' is in Shadow mode' : c.confidence < S.policy.threshold ? 'confidence below '+S.policy.threshold.toFixed(2) : null;
    if(gate){
      ev(c,'agent','Decision','Confidence '+c.confidence.toFixed(2)+' · '+gate+' → staff approval');
      c.findings = [ (mode==='shadow'? payer.name+' is in Shadow mode: every submission needs staff approval before it goes out.' : 'Held for approval because '+gate+'.'), 'All required documents attached.'];
      setState(c,'NEEDS_APPROVAL'); notify(['staff'],'A submission is waiting for your approval', c.id);
      c.live=false; render(); return;
    }
    ev(c,'agent','Decision','Confidence '+c.confidence.toFixed(2)+' ≥ '+S.policy.threshold.toFixed(2)+' · auto-submit ('+(mode==='wider'?'Wider autonomy':'Supervised')+')'); await tick();
  }
  if(from==='intake' || from==='decision' || from==='submit'){
    setState(c,'SUBMITTING'); c.findings=[]; await tick();
    ev(c,'agent','Submission','Inquire-before-submit: no open authorization for this order','idempotency '+c.idem);
    let done=false;
    if(payer.electronic){
      const r = payer.routes[0]; const ref = r==='FHIR PAS' ? 'PAS-'+rnd(5) : '278 TRN 5510-'+rnd(4);
      c.attempts.push({channel:'electronic', label: r==='FHIR PAS'?'FHIR PAS Claim/$submit':'X12 278 request', outcome:'Accepted', ref, ts:now()});
      ev(c,'agent','Submission','Submitted electronically via '+r, ref); done=true;
    } else {
      c.attempts.push({channel:'electronic', label:'No electronic PA route', outcome:'Skipped', ref:'', ts:now()});
      ev(c,'agent','Submission','No electronic route for '+payer.name+' → payer portal'); await tick();
      if(payer.portalFails){
        c.attempts.push({channel:'portal', label:payer.portal, outcome:'Failed — session timeout after upload', ref:'', ts:now()});
        ev(c,'agent','Submission','Browser agent: portal failed (session timeout) → voice fallback'); await tick(900);
        if(payer.automatedCaller){
          const ref='Call ref 1001-'+rnd(4);
          c.attempts.push({channel:'voice', label:'Retell call to '+payer.name+' UM line', outcome:'Request accepted by representative', ref, ts:now(), transcript:true});
          ev(c,'agent','Submission','Voice: IVR navigated, 11 min hold, request accepted by representative', ref); done=true;
        }
      } else {
        const ref='Portal conf '+rnd(6);
        c.attempts.push({channel:'portal', label:payer.portal, outcome:'Submitted', ref, ts:now()});
        ev(c,'agent','Submission','Browser agent submitted via '+payer.portal, ref); done=true;
      }
    }
    setState(c,'SUBMITTED'); c.deadline = addDays(TODAY,7);
    ev(c,'agent','Follow-Up','Decision timer started · 7 days (standard)'); await tick(900);
    if(payer.pends){
      setState(c,'PENDED');
      ev(c,'agent','Follow-Up','Payer pended via CDex Task: requests most recent imaging report','CDex Task '+rnd(5)); await tick(900);
      c.docs.push(D('Imaging report (requested)','resupplied'));
      ev(c,'agent','Follow-Up','Retrieved imaging report from EHR and resupplied without restarting the request','attach AT-'+rnd(4)); await tick(900);
      setState(c,'SUBMITTED'); await tick(500);
    }
    const authNo = (payer.name.slice(0,2).toUpperCase())+rnd(7);
    c.decision = {type:'Approved', authNo, from:addDays(TODAY,1), to:addDays(TODAY,31), units:1, payerRef: payer.name.split(' ')[0].toUpperCase().slice(0,4)+'-REF-'+rnd(6)};
    setState(c,'APPROVED');
    ev(c,'agent','Follow-Up','Payer decision: APPROVED · Auth '+authNo, c.decision.payerRef);
    ev(c,'agent','Follow-Up','Written back to EHR: auth #, valid '+fd(c.decision.from)+'–'+fd(c.decision.to)+', reference','DocRef wb-'+c.id.slice(3));
    notify(['physician'],'An authorization was approved', c.id);
  }
  c.live=false; render();
}

const ACTIONS = {
  approveSubmit(c){ ev(c,'user',me().name+' · Operations','Approved submission (Shadow / held case)'); toast('Approved. The agent is submitting now.'); runCase(c,'submit'); },
  returnPhysician(c){ ev(c,'user',me().name+' · Operations','Returned to ordering physician for order clarification'); setState(c,'WITHDRAWN'); notify(['physician'],'An order was returned to you for clarification', c.id); toast('Returned to the ordering physician.'); },
  rerunElig(c){ const p=patient(c.patientId); p.active=true; p.payer='uhc'; c.payer='uhc'; ev(c,'user',me().name+' · Operations','Updated coverage: UnitedHealthcare Choice Plus (new card on file) · re-run eligibility'); c.exception=''; toast('Coverage updated. Re-running from eligibility.'); runCase(c,'intake'); },
  requestExtension(c){ c.extensionRequested=true; ev(c,'user',me().name+' · Operations','Asked agent to request a date-span extension to cover the Oct 20 procedure'); ev(c,'agent','Submission','Extension request sent via FHIR PAS update','PAS-UPD-'+rnd(5)); toast('Extension requested. The agent will track the response.'); },
  attachEvidence(c){
    c.docs.forEach(d=>{ if(d.status==='missing'){ d.status='attached'; d.source='athenahealth · PT progress notes Aug 4 – Sep 19 (7 wks)'; }});
    ev(c,'user',me().name+' · Clinical reviewer (licensed)','Attested conservative-therapy evidence found in chart · returned to agent');
    c.findings=[]; c.confidence=0.92; patient(c.patientId).therapy=true; toast('Evidence attached. The agent is resuming at the decision step.'); runCase(c,'decision'); },
  notSupported(c){ ev(c,'user',me().name+' · Clinical reviewer (licensed)','Determined documentation does not support request · ordering physician notified'); setState(c,'WITHDRAWN'); notify(['physician'],'A clinical reviewer returned one of your orders', c.id); toast('Physician notified. Case closed as withdrawn.'); },
  approveAppeal(c){ ev(c,'user',me().name+' · Clinical reviewer (licensed)','Approved appeal packet (first-level appeal) with 14 weeks PT + ESI history'); ev(c,'agent','Submission','Appeal submitted via Availity attachments','AV-APL-'+rnd(5)); setState(c,'APPEAL_SUBMITTED'); c.deadline=addDays(TODAY,30); toast('Appeal submitted. Decision tracked by the Follow-Up agent.'); },
  scheduleP2P(c){ ev(c,'user',me().name+' · Clinical reviewer (licensed)','Requested peer-to-peer review with payer medical director'); ev(c,'agent','Follow-Up','Peer-to-peer requested by phone · slot offered Oct 6, 2:30 pm ET','Call ref 1001-'+rnd(4)); setState(c,'P2P_SCHEDULED'); toast('Peer-to-peer requested. It will appear on your calendar.'); },
};
function can(c, action){
  const r=S.role;
  const map = { approveSubmit:['staff'], returnPhysician:['staff'], rerunElig:['staff'], requestExtension:['staff'], attachEvidence:['clinical'], notSupported:['clinical'], approveAppeal:['clinical'], scheduleP2P:['clinical'] };
  return (map[action]||[]).includes(r);
}

function caseRow(c, cols){
  const p=patient(c.patientId), pr=PROC[c.cpt];

    patient:`<td>${esc(p.name)}<span class="sub">${esc(p.mrn)}</span></td>`,
    proc:`<td>${esc(pr.short)} <span class="mono muted">${c.cpt}</span><span class="sub">${esc(c.icd)} · ${esc(ICD[c.icd]||'')}</span></td>`,
    payer:`<td>${esc(PAYERS[c.payer].name)}<span class="sub">${esc(PAYERS[c.payer].plan)}</span></td>`,
    status:`<td>${pill(c)}</td>`,
    reason:`<td class="small" style="max-width:300px">${esc(reasonText(c))}</td>`,
    sched:`<td class="num">${fd(c.scheduled)}</td>`,
    updated:`<td class="num small muted">${esc(c.updated)}</td>`,
    auth:`<td class="mono">${c.decision&&c.decision.authNo?esc(c.decision.authNo):'—'}</td>`,
  };
  return `<tr class="click" data-case="${c.id}" tabindex="0">${cols.map(k=>cells[k]).join('')}</tr>`;
}
const HEAD = {id:'Case',patient:'Patient',proc:'Procedure',payer:'Payer',status:'Status',reason:'Why it is here',sched:'Procedure date',updated:'Updated',auth:'Auth #'};
function caseTable(list, cols){
  if(!list.length) return `<div class="empty">No cases here. The agent is handling everything else.</div>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(k=>`<th>${HEAD[k]}</th>`).join('')}</tr></thead><tbody>${list.map(c=>caseRow(c,cols)).join('')}</tbody></table></div>`;
}
function reasonText(c){
  if(c.state==='NEEDS_APPROVAL') return S.policy.trust[c.payer]==='shadow' ? 'Shadow mode: approve before it is sent' : 'Held: below confidence threshold or kill switch on';
  if(c.state==='ADMIN_EXCEPTION') return c.exception;
  if(c.state==='CLINICAL_REVIEW') return 'Missing: 6 weeks conservative treatment documentation';
  if(c.state==='DENIED') return 'Denied for medical necessity · appeal packet ready';
  if(c.state==='P2P_SCHEDULED') return 'Peer-to-peer requested';
  if(isExpiring(c)) return 'Approval ends '+fd(c.decision.to)+', procedure '+fd(c.scheduled);
  if(c.state==='PENDED') return 'Payer asked for more; agent resupplied it';
  return '';
}

function renderDrawer(){
  const o=document.getElementById('overlay');
  if(!S.openCase){ o.innerHTML=''; return; }
  const c=findCase(S.openCase); if(!c){ o.innerHTML=''; return; }
  if(S.role==='master'){ o.innerHTML=''; S.openCase=null; return; }
  const p=patient(c.patientId), payer=PAYERS[c.payer], pr=PROC[c.cpt], si=stageIndex(c);
  const stopStates=['CLINICAL_REVIEW','NEEDS_APPROVAL','ADMIN_EXCEPTION'];
  const stages = STAGES.map((s,i)=>{ let cls=''; if(i<si) cls='done'; else if(i===si){ cls = WORKING.includes(c.state)||c.state==='SUBMITTED'||c.state==='PENDED' ? 'now' : stopStates.includes(c.state)?'stop' : c.state==='DENIED'?'fail':'done'; } return `<div class="stage ${cls}"><span class="bar"></span><span>${s}</span></div>`; }).join('');
  const chOrder=[['electronic','Electronic','PAS / X12 278 / API'],['portal','Portal','browser agent'],['voice','Voice','IVR + rep call'],['human','Human','last resort']];
  const channels = chOrder.map(([k,l,d])=>{ const a=c.attempts.filter(x=>x.channel===k).slice(-1)[0]; const cls=!a?'':a.outcome.startsWith('Skipped')?'skip':a.outcome.startsWith('Failed')?'failed':'used'; return `<div class="ch ${cls}"><b>${l}</b><span class="st">${a?esc(a.outcome):d}</span></div>`; }).join('');
  let outcome='';
  if(c.decision && ['APPROVED','PARTIAL'].includes(c.state)) outcome=`<div class="outcome ${isExpiring(c)?'warn':'ok'}"><span class="big">${esc(pr.short)} — ${c.state==='PARTIAL'?'PARTIALLY APPROVED':'APPROVED'}</span><span class="mono">Auth ${esc(c.decision.authNo)} · Valid ${fd(c.decision.from)}–${fd(c.decision.to)} · Units ${esc(c.decision.units)} · Ref ${esc(c.decision.payerRef)}</span>${isExpiring(c)?`<span>Approval ends ${fd(c.decision.to)} but the procedure is ${fd(c.scheduled)}.</span>`:''}${c.extensionRequested?'<span>Extension requested; tracking response.</span>':''}</div>`;
  else if(c.state==='NO_AUTH_REQUIRED') outcome=`<div class="outcome info"><span class="big">No authorization required</span><span>Logged to the chart with source, date and reference number. No portal, no call.</span></div>`;
  else if(c.state==='CLINICAL_REVIEW') outcome=`<div class="outcome warn"><span class="big">CLINICAL REVIEW REQUIRED</span><span>Missing: 6 weeks conservative treatment documentation. Human review needed.</span></div>`;
  else if(c.state==='ADMIN_EXCEPTION') outcome=`<div class="outcome warn"><span class="big">Administrative exception</span><span>${esc(c.exception)}</span></div>`;
  else if(c.state==='NEEDS_APPROVAL') outcome=`<div class="outcome warn"><span class="big">Ready to submit · waiting for approval</span><span>Confidence ${c.confidence?.toFixed(2)} · ${esc(reasonText(c))}</span></div>`;
  else if(c.state==='DENIED') outcome=`<div class="outcome bad"><span class="big">Denied · appeal packet ready</span><span>${esc(c.decision?.reason||'')} · ${esc(c.decision?.payerRef||'')}</span></div>`;
  else if(c.state==='WITHDRAWN') outcome=`<div class="outcome"><span class="big">Withdrawn</span><span>Returned to the ordering physician.</span></div>`;
  else if(['SUBMITTED','PENDED','APPEAL_SUBMITTED','P2P_SCHEDULED'].includes(c.state)) outcome=`<div class="outcome info"><span class="big">${esc(status(c).label)}</span><span>${c.deadline?'Decision due by '+fd(c.deadline)+'. ':''}The Follow-Up agent is tracking it; nothing needed from you.</span></div>`;
  else outcome=`<div class="outcome info"><span class="big">The agent is working on it</span><span>Watch the stages above. This takes seconds when the payer has an electronic route.</span></div>`;

  const btns=[];
  const B=(a,l,cls)=> can(c,a) ? btns.push(`<button class="btn ${cls||''}" data-caseact="${a}">${l}</button>`) : null;
  if(c.state==='NEEDS_APPROVAL'){ B('approveSubmit','Approve &amp; submit','go'); B('returnPhysician','Return to physician'); }
  if(c.state==='ADMIN_EXCEPTION'){ B('rerunElig','Coverage updated · re-run eligibility','primary'); }
  if(isExpiring(c)){ B('requestExtension','Request date extension','primary'); }
  if(c.state==='CLINICAL_REVIEW'){ B('attachEvidence','Attach PT notes from chart &amp; return to agent','go'); B('notSupported','Not supported · notify physician','danger'); }
  if(c.state==='DENIED'){ B('approveAppeal','Approve appeal packet &amp; submit','go'); B('scheduleP2P','Request peer-to-peer'); }
  const actionNeeded = ['NEEDS_APPROVAL','ADMIN_EXCEPTION','CLINICAL_REVIEW','DENIED'].includes(c.state)||isExpiring(c);
  const who = status(c).group==='clinical'?'a clinical reviewer':'operations staff';
  const actions = btns.length ? `<div class="row">${btns.join('')}</div>` : actionNeeded ? `<div class="note">Waiting on ${who}. Switch the signed-in user to act on it.</div>` : '';
  const voice = c.attempts.find(a=>a.transcript);

  o.innerHTML = `<div class="scrim" data-act="closeCase"></div>
  <aside class="drawer" role="dialog" aria-label="Case ${c.id}">
    <div class="drawer-h"><div style="min-width:0"><div class="eyebrow"><span class="mono">${c.id}</span> · ${esc(payer.name)} ${esc(payer.plan)}</div><h2>${esc(p.name)} · ${esc(pr.short)}</h2><div class="row" style="margin-top:6px">${pill(c)}${c.live?'<span class="small muted">live</span>':''}</div></div>
      <button class="btn small close" data-act="closeCase">Close</button></div>
    <div class="drawer-b">
      <div class="stages" aria-label="Waterfall progress">${stages}</div>
      ${outcome}
      ${c.findings.length?`<section class="panel"><div class="panel-h"><h2>Agent findings</h2><p>Facts and gaps only; no medical judgment</p></div><div class="panel-b"><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px">${c.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div></section>`:''}
      ${actions}
      <section class="panel"><div class="panel-b facts">
        <div class="fact"><div class="k">Patient</div><div class="v">${esc(p.name)}<br><span class="muted small">${esc(p.mrn)} · DOB ${esc(p.dob)}</span></div></div>
        <div class="fact"><div class="k">Order</div><div class="v"><span class="mono">${c.cpt}</span> ${esc(pr.name)}<br><span class="muted small">${esc(c.icd)} ${esc(ICD[c.icd]||'')}</span></div></div>
        <div class="fact"><div class="k">Procedure date</div><div class="v">${fd(c.scheduled)}<br><span class="muted small">Ordered by ${esc(user(c.orderedBy).name)}</span></div></div>
        <div class="fact"><div class="k">Coverage</div><div class="v">${esc(payer.name)}<br><span class="muted small mono">${esc(p.member)}</span></div></div>
        <div class="fact"><div class="k">Confidence</div><div class="v num">${c.confidence!=null?c.confidence.toFixed(2):'—'} <span class="muted small">gate ${S.policy.threshold.toFixed(2)} · ${S.policy.trust[c.payer]}</span></div></div>
        <div class="fact"><div class="k">Idempotency key</div><div class="v mono">${esc(c.idem)}</div></div>
      </div></section>
      <section><div class="eyebrow" style="margin-bottom:8px">Submission waterfall</div><div class="channels">${channels}</div></section>
      ${c.docs.length?`<section><div class="eyebrow" style="margin-bottom:8px">Clinical packet · minimum necessary</div><div class="doclist">${c.docs.map(d=>`<div class="doc"><span>${esc(d.name)}<span class="sub small muted" style="display:block">${esc(d.source)}</span></span><span class="pill ${d.status==='missing'?'p-warn':d.status==='resupplied'||d.status==='prepared'?'p-info':'p-ok'}">${d.status}</span></div>`).join('')}</div></section>`:''}
      ${voice?`<section><div class="eyebrow" style="margin-bottom:8px">Call transcript · ${esc(voice.ref)} · recorded, two-party consent checked</div><div class="transcript">
        <div><b>Agent:</b> I'm an automated assistant calling on behalf of ${esc(user(c.orderedBy).name)} regarding a prior authorization.</div>
        <div><b>Rep:</b> Okay. Member ID and date of birth?</div><div><b>Agent:</b> ${esc(p.member)}, ${esc(p.dob)}. CPT ${c.cpt}, diagnosis ${esc(c.icd)}.</div>
        <div><b>Rep:</b> I've entered the request. Reference number ${esc(voice.ref.replace('Call ref ',''))}. Decision within 3 business days.</div></div></section>`:''}
      <section><div class="eyebrow" style="margin-bottom:8px">Activity · write-once audit</div><div class="timeline">${c.events.slice().reverse().map(e=>`<div class="tl ${e.kind==='user'?'user':/APPROVED|Written back|no authorization/i.test(e.text)?'ok':/INACTIVE|CLINICAL|failed|DENIED|Shadow|approval/i.test(e.text)?'warn':'agent'}"><span class="t">${esc(e.ts.replace(/^\w+ \d+ /,''))}<br>${esc(e.ts.split(' ').slice(0,2).join(' '))}</span><span class="m"></span><div><div>${esc(e.text)}</div><div class="who">${esc(e.who)}${e.ref?` · <span class="ref">${esc(e.ref)}</span>`:''}</div></div></div>`).join('')}</div></section>
    </div></aside>`;
}

/* ---------------- Render root ---------------- */
function render(){
  renderSide(); renderTop();
  const page = P[S.route] || P[ROLES[S.role].home];
  const main=document.getElementById('main');
  const focusId = document.activeElement && document.activeElement.id;
  const sel = focusId==='caseSearch' ? document.activeElement.selectionStart : null;
  main.innerHTML = page();
  if(focusId==='caseSearch'){ const el=document.getElementById('caseSearch'); if(el){ el.focus(); el.setSelectionRange(sel,sel);} }
  renderDrawer();
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
function allowedRoute(r){ return NAV[S.role].some(n=>n[0]===r) || BLUEPRINT_NAV.some(n=>n[0]===r); }

/* ---------------- Events ---------------- */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-go],[data-case],[data-act],[data-caseact],[data-qf],[data-cf],[data-notif],[data-conn],[data-inspect]');
  if(!t){ if(S.notifOpen && !e.target.closest('.npanel')){ S.notifOpen=false; render(); } return; }
  if(t.dataset.go){ S.route=t.dataset.go; S.notifOpen=false; render(); window.scrollTo(0,0); return; }
  if(t.dataset.case){ S.openCase=t.dataset.case; render(); return; }
  if(t.dataset.qf){ S.queueFilter=t.dataset.qf; render(); return; }
  if(t.dataset.cf){ S.filter=t.dataset.cf; render(); return; }
  if(t.dataset.inspect){ S.inspect=t.dataset.inspect; render(); return; }
  if(t.dataset.caseact){ const c=findCase(S.openCase); ACTIONS[t.dataset.caseact](c); render(); return; }
  if(t.dataset.notif){ const n=S.notifs.find(x=>x.id===t.dataset.notif); n.read=true; S.notifOpen=false; if(n.caseId) S.openCase=n.caseId; else if(S.role==='admin') S.route='connections'; render(); return; }
  if(t.dataset.conn){ const c=S.connections.find(x=>x.id===t.dataset.conn); const wasFailed=c.state==='refresh_failed'; c.state='testing'; render();
    setTimeout(()=>{ c.state='active'; c.tested=now(); c.latency=(200+Math.floor(Math.random()*500))+' ms'; S.audit.unshift({ts:c.tested, actor:me().name, actorType:'User', action:(wasFailed?'Reconnected ':'Tested ')+c.system+' connection · OK', target:c.system, ref:'conn '+c.id}); render(); toast(c.system+(wasFailed?' reconnected.':' responded in '+c.latency+'.')); },1100); return; }
  const a=t.dataset.act;
  if(a==='toggleNotif'){ S.notifOpen=!S.notifOpen; render(); return; }
  if(a==='closeCase'){ S.openCase=null; render(); return; }
  if(a==='closeInspect'){ S.inspect=null; render(); return; }
  if(a==='runMatch'){ S.onboardMatch=true; render(); toast('Registry match complete: 3 of 4 systems already supported.'); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.openCase){ S.openCase=null; render(); }
  if(e.key==='Enter' && e.target.matches('tr[data-case]')){ S.openCase=e.target.dataset.case; render(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='roleSel'){ S.role=t.value; S.route=ROLES[S.role].home; S.openCase=null; S.notifOpen=false; render(); toast('Signed in as '+me().name+' · '+ROLES[S.role].label); return; }
  if(t.dataset.trust){ const k=t.dataset.trust, old=S.policy.trust[k]; S.policy.trust[k]=t.value; S.policy.version++; const lab={shadow:'Shadow',supervised:'Supervised',wider:'Wider'};
    S.policyLog.unshift({v:S.policy.version, ts:now(), by:me().name, change:PAYERS[k].name+' moved '+lab[old]+' → '+lab[t.value]}); auditCfg('Trust mode '+PAYERS[k].name+': '+lab[old]+' → '+lab[t.value],'policy'); render(); toast('Saved as policy v'+S.policy.version+'.'); return; }
  if(t.id==='thr'){ const old=S.policy.threshold; S.policy.threshold=Number(t.value); S.policy.version++; S.policyLog.unshift({v:S.policy.version, ts:now(), by:me().name, change:'Confidence threshold '+old.toFixed(2)+' → '+S.policy.threshold.toFixed(2)}); auditCfg('Confidence threshold → '+S.policy.threshold.toFixed(2),'policy'); render(); toast('Threshold saved as policy v'+S.policy.version+'.'); return; }
  if(t.id==='kill'){ S.policy.killSwitch=t.checked; S.policy.version++; S.policyLog.unshift({v:S.policy.version, ts:now(), by:me().name, change:'Kill switch '+(t.checked?'ON':'OFF')}); auditCfg('Kill switch '+(t.checked?'ON':'OFF'),'policy'); render(); toast(t.checked?'Kill switch on. Automatic submission stopped.':'Kill switch off.'); return; }
  if(t.dataset.urole){ const [uid,r]=t.dataset.urole.split('|'); const u=user(uid); if(t.checked){ if(!u.roles.includes(r)) u.roles.push(r);} else u.roles=u.roles.filter(x=>x!==r); S.audit.unshift({ts:now(), actor:me().name, actorType:'User', action:(t.checked?'Granted ':'Removed ')+ROLES[r].label+' role · '+u.name, target:'keycloak', ref:'realm cascade-spine'}); toast('Role updated for '+u.name+'.'); render(); return; }
});
document.addEventListener('input', e=>{ if(e.target.id==='caseSearch'){ S.search=e.target.value; render(); } if(e.target.id==='thr'){ const l=e.target.previousElementSibling; if(l) l.querySelector('span').textContent=Number(e.target.value).toFixed(2); } });
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='orderForm'){
    const pt=document.getElementById('o_pt').value, cpt=document.getElementById('o_cpt').value, icd=document.getElementById('o_icd').value, sched=document.getElementById('o_date').value||'2026-10-14';
    const dup = S.cases.find(c=>c.patientId===pt && c.cpt===cpt && !['WITHDRAWN'].includes(c.state));
    if(dup){ toast('An authorization for this patient and CPT already exists ('+dup.id+'). Opening it instead of creating a duplicate.'); S.openCase=dup.id; render(); return; }
    S.seq++; const c=mk({n:S.seq, pt, cpt, icd, sched, state:'RECEIVED', created:'Oct 1'}); c.orderedBy='u_rao'; c.payer=patient(pt).payer;
    S.route='orders'; S.openCase=c.id; render(); runCase(c,'intake'); return;
  }
  if(e.target.id==='inviteForm'){
    const name=document.getElementById('i_name').value.trim(), email=document.getElementById('i_email').value.trim(), role=document.getElementById('i_role').value;
    if(!name||!email){ toast('Add a name and work email to send the invite.'); return; }
    USERS.push({id:'u_'+rnd(4), name, email, roles:[role], title:'Invited', mfa:false, status:'Invited'});
    S.audit.unshift({ts:now(), actor:me().name, actorType:'User', action:'Invited '+name+' as '+ROLES[role].label, target:'keycloak', ref:'realm cascade-spine'});
    render(); toast('Invite sent to '+email+'.'); return;
  }
});

seed();
const hash=(location.hash||'').slice(1);
if(hash && (P[hash])){ for(const r in NAV){ if(NAV[r].some(n=>n[0]===hash)){ S.role=r; break; } } S.route=hash; }
render();
</script>
