name: Deploy NexAuthAI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "nexauthai/**"
      - "*.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Pages needs to read the repo, mint an OIDC token, and write the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexauthai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nexauthai/package-lock.json

      - name: Install dependencies
        env:
          # playwright is a devDependency used only by the local smoke script.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Resolve Pages base path
        id: base
        run: echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Assemble site
        working-directory: .
        run: |
          rm -rf site
          mkdir -p site
          cp -r nexauthai/dist/. site/
          # The study write-ups already live at the repo root; keep their URLs.
          cp ./*.html site/ 2>/dev/null || true
          # GitHub Pages serves the site-root 404.html for any unmatched path,
          # which is how the SPA's deep links survive a cold load.
          cp nexauthai/dist/index.html site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
