<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Prior Authorization · Platform Prototype</title>
<style>
:root{
  --paper:#EEF1F4; --surface:#FBFCFD; --sunken:#E2E7ED; --raise:#FFFFFF;
  --ink:#10151C; --ink-soft:#4A5766; --ink-faint:#7C8896;
  --rule:#C9D2DC; --rule-soft:#E0E6EC;
  --accent:#125F7A; --accent-ink:#0D4A60; --accent-wash:#DBEAF0;
  --ok:#15693F; --ok-wash:#D9EDE2;
  --warn:#8A5A0B; --warn-wash:#F5E9D2;
  --bad:#9B2C22; --bad-wash:#F6DFDC;
  --human:#6A3E86; --human-wash:#EAE0F2;
  --agent:#1D4E8F; --agent-wash:#DDE6F5;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(16,21,28,.06),0 4px 14px rgba(16,21,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B0F14; --surface:#131A22; --sunken:#182029; --raise:#1B242E;
  --ink:#DEE6EE; --ink-soft:#97A5B4; --ink-faint:#6C7A89;
  --rule:#26313D; --rule-soft:#1D2630;
  --accent:#4FA8C6; --accent-ink:#79C3DC; --accent-wash:#102A35;
  --ok:#4EC08A; --ok-wash:#102A1E;
  --warn:#D6A25B; --warn-wash:#2C2314;
  --bad:#E38176; --bad-wash:#2E1715;
  --human:#B396CC; --human-wash:#231A2C;
  --agent:#7FA8E4; --agent-wash:#141F31;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --paper:#0B0F14; --surface:#131A22; --sunken:#182029; --raise:#1B242E;
  --ink:#DEE6EE; --ink-soft:#97A5B4; --ink-faint:#6C7A89;
  --rule:#26313D; --rule-soft:#1D2630;
  --accent:#4FA8C6; --accent-ink:#79C3DC; --accent-wash:#102A35;
  --ok:#4EC08A; --ok-wash:#102A1E;
  --warn:#D6A25B; --warn-wash:#2C2314;
  --bad:#E38176; --bad-wash:#2E1715;
  --human:#B396CC; --human-wash:#231A2C;
  --agent:#7FA8E4; --agent-wash:#141F31;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.018em;text-wrap:balance}
p{margin:0 0 12px;max-width:74ch}
a{color:var(--accent-ink)}
::selection{background:var(--accent-wash)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:238px minmax(0,1fr);height:100vh;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 18px 16px;border-bottom:1px solid var(--rule)}
.brand .bt{font-weight:700;font-size:15px;letter-spacing:-.025em;line-height:1.2}
.brand .bs{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.nav{padding:10px 10px;flex:1}
.nav button{display:flex;gap:11px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink-soft);line-height:1.3}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button.on{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.nav button .n{font-family:var(--mono);font-size:10px;color:var(--ink-faint);width:14px;flex:none}
.nav button.on .n{color:var(--accent-ink)}
.nav .navlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:14px 10px 6px}
.sidefoot{padding:14px 16px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--ink-faint)}
.sidefoot .mock{display:inline-block;border:1px solid var(--warn);color:var(--warn);padding:2px 6px;letter-spacing:.1em;margin-bottom:8px}
.themebtn{background:none;border:1px solid var(--rule);color:var(--ink-faint);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:4px 8px;cursor:pointer;border-radius:4px;margin-top:8px}
.themebtn:hover{border-color:var(--accent);color:var(--accent-ink)}

.main{overflow-y:auto;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding:16px 30px 13px;display:flex;align-items:flex-end;gap:20px;justify-content:space-between}
.topbar h1{font-size:19px;font-weight:650}
.topbar .sub{color:var(--ink-faint);font-size:12.5px;margin-top:3px;max-width:78ch}
.wrap{padding:26px 30px 70px;max-width:1360px}

/* ---------- primitives ---------- */
.kick{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px 20px}
.card h3{font-size:14.5px;font-weight:650;margin-bottom:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.sec{margin-bottom:34px}
.sech{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:9px;margin-bottom:16px}
.sech h2{font-size:15.5px;font-weight:650}
.sech .sn{font-family:var(--mono);font-size:10px;color:var(--accent-ink);letter-spacing:.08em}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.mono{font-family:var(--mono)}
.tiny{font-size:11.5px}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)}
.c-acc{color:var(--accent-ink)} .c-hum{color:var(--human)} .c-ag{color:var(--agent)} .c-f{color:var(--ink-faint)}
.chip.fill{border:0;padding:3px 8px}
.f-ok{background:var(--ok-wash);color:var(--ok)} .f-warn{background:var(--warn-wash);color:var(--warn)}
.f-bad{background:var(--bad-wash);color:var(--bad)} .f-acc{background:var(--accent-wash);color:var(--accent-ink)}
.f-hum{background:var(--human-wash);color:var(--human)} .f-ag{background:var(--agent-wash);color:var(--agent)}
.f-f{background:var(--sunken);color:var(--ink-faint)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--rule);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink);filter:none}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{background:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.8px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule-soft);vertical-align:top;line-height:1.45}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;background:var(--sunken);border-bottom:1px solid var(--rule);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--sunken)}
.num{font-variant-numeric:tabular-nums}
.note{border-left:2px solid var(--accent);padding:2px 0 2px 13px;color:var(--ink-soft);font-size:12.8px;max-width:76ch}
.warnbox{background:var(--warn-wash);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:12.8px;color:var(--ink-soft)}
.warnbox b{color:var(--warn);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.kpi .kl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px;line-height:1.5}
.kpi .kv{font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .kv.acc{color:var(--accent)}
.kpi .kd{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.45}
.kpi .arrow{font-size:12.5px;color:var(--ink-faint);font-family:var(--mono);margin-top:7px}
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}

/* ---------- architecture ---------- */
.stack{display:flex;flex-direction:column;gap:0}
.band{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;position:relative}
.band + .bandgap{height:26px;position:relative}
.bandgap::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule);transform:translateX(-.5px)}
.bandgap::after{content:"";position:absolute;left:50%;bottom:4px;width:7px;height:7px;border-right:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);transform:translateX(-50%) rotate(45deg)}
.bandgap span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-faint);white-space:nowrap}
.bandhead{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.bandhead .bn{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.bandhead h3{font-size:13.5px;font-weight:650}
.bandhead .bd{font-size:11.5px;color:var(--ink-faint)}
.comps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.comp{background:var(--raise);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;transition:.12s;min-height:60px}
.comp:hover{border-color:var(--accent);box-shadow:var(--sh);transform:translateY(-1px)}
.comp.sel{border-color:var(--accent);background:var(--accent-wash)}
.comp .cn{font-size:12.5px;font-weight:600;line-height:1.28;display:block}
.comp .cp{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:5px;display:block;line-height:1.45}
.comp.core{border-left:2.5px solid var(--accent)}
.comp.mockfull .cn::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.band.tone-platform{background:var(--accent-wash);border-color:var(--accent)}
@media(min-width:1080px){.band.tone-platform .comps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.band.tone-agent{background:var(--agent-wash);border-color:var(--agent)}

/* side panel */
.panel{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;background:var(--surface);border-left:1px solid var(--rule);box-shadow:-12px 0 40px rgba(0,0,0,.14);z-index:60;overflow-y:auto;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.panel.open{transform:none}
.panel .ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:16px 20px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.panel .ph h3{font-size:15px;font-weight:650;line-height:1.25}
.panel .pb{padding:18px 20px 60px}
.panel .x{background:none;border:0;font-size:20px;color:var(--ink-faint);cursor:pointer;line-height:1;padding:0 2px}
.panel .x:hover{color:var(--ink)}
.dl{margin:0 0 16px}
.dl dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px}
.dl dd{margin:0 0 14px;font-size:12.8px;color:var(--ink-soft);line-height:1.5}
.dl dd ul{margin:0;padding-left:16px}
.dl dd li{margin-bottom:4px}
.dl dd li::marker{color:var(--accent)}
.taglist{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- agents ---------- */
.agentcard{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:9px;text-align:left}
.agentcard:hover{border-color:var(--agent);box-shadow:var(--sh);transform:translateY(-1px)}
.agentcard .ah{display:flex;gap:10px;align-items:flex-start}
.agentcard .badge{width:28px;height:28px;border-radius:6px;background:var(--agent-wash);color:var(--agent);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;flex:none}
.agentcard h3{font-size:13.5px;font-weight:650;line-height:1.25}
.agentcard .role{font-size:12.3px;color:var(--ink-soft);line-height:1.5}
.agentcard .esc{font-size:11.5px;color:var(--human);border-left:2px solid var(--human);padding-left:9px;line-height:1.45}
.agentcard .foot{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);border-top:1px solid var(--rule-soft);padding-top:8px;margin-top:auto}

/* ---------- process flow ---------- */
.lanes{border:1px solid var(--rule);border-radius:8px;background:var(--surface);overflow-x:auto}
.lanehead{display:grid;grid-template-columns:52px repeat(4,minmax(176px,1fr));position:sticky;top:0;background:var(--sunken);border-bottom:1px solid var(--rule);z-index:5}
.lanehead div{padding:9px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);border-left:1px solid var(--rule-soft)}
.lanehead div:first-child{border-left:0}
.steprow{display:grid;grid-template-columns:52px repeat(4,minmax(176px,1fr));border-bottom:1px solid var(--rule-soft);min-height:62px}
.steprow:last-child{border-bottom:0}
.steprow .gut{padding:12px 0 0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-faint);border-right:1px solid var(--rule-soft)}
.steprow .cell{border-left:1px solid var(--rule-soft);padding:9px 10px;position:relative}
.steprow .cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:repeating-linear-gradient(to bottom,var(--rule) 0 3px,transparent 3px 7px)}
.steprow .cell:first-of-type{border-left:0}
.stepbox{position:relative;z-index:2;background:var(--raise);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;cursor:pointer;transition:.12s;text-align:left;width:100%}
.stepbox:hover{border-color:var(--accent);box-shadow:var(--sh)}
.stepbox .st{display:block;font-size:12.3px;font-weight:600;line-height:1.3}
.stepbox .ss{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:4px;line-height:1.45}
.stepbox.decision{border-style:dashed;border-color:var(--warn);background:var(--warn-wash)}
.stepbox.human{border-color:var(--human);background:var(--human-wash);border-width:1.5px}
.stepbox.agent{border-left:2.5px solid var(--agent)}
.stepbox.term{border-color:var(--ok);background:var(--ok-wash)}
.stepbox.termbad{border-color:var(--bad);background:var(--bad-wash)}
.branches{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

/* ---------- journey ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--ink-faint);font-size:13px;font-weight:550;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.jstage{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;border-bottom:1px solid var(--rule-soft)}
.jstage:last-child{border-bottom:0}
.jstage .jn{padding:15px 16px 15px 0;border-right:1px solid var(--rule-soft)}
.jstage .jn .t{font-size:13px;font-weight:650;line-height:1.3}
.jstage .jn .m{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:6px;line-height:1.6}
.jcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0}
.jcols > div{padding:15px 16px;border-left:1px solid var(--rule-soft)}
.jcols > div:first-child{border-left:0}
.jcols h5{margin:0 0 7px;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.jcols p{margin:0;font-size:12.3px;line-height:1.5;color:var(--ink-soft);max-width:none}
.jcols .pain{color:var(--bad)}
.jcols .after{color:var(--ok)}
.emobar{display:flex;gap:3px;margin-top:9px}
.emobar i{flex:1;height:4px;border-radius:2px;background:var(--sunken)}

/* ---------- live demo ---------- */
.demo{display:grid;grid-template-columns:326px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1180px){.demo{grid-template-columns:1fr}}
.queue{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden;position:sticky;top:76px}
.queue .qh{padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px}
.queue .qh h3{font-size:13px;font-weight:650}
.qfilter{display:flex;gap:4px;padding:9px 12px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap;background:var(--sunken)}
.qfilter button{background:none;border:1px solid transparent;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;cursor:pointer;color:var(--ink-faint)}
.qfilter button:hover{color:var(--ink)}
.qfilter button.on{background:var(--raise);border-color:var(--rule);color:var(--ink)}
.qlist{max-height:calc(100vh - 260px);overflow-y:auto}
.qitem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-soft);padding:11px 14px;cursor:pointer;border-left:3px solid transparent}
.qitem:hover{background:var(--sunken)}
.qitem.on{background:var(--accent-wash);border-left-color:var(--accent)}
.qitem .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.qitem .pn{font-size:12.8px;font-weight:600;line-height:1.3}
.qitem .r2{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:4px;line-height:1.5}
.qitem .r3{margin-top:7px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sla{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.sla.hot{color:var(--bad)}

.work{background:var(--surface);border:1px solid var(--rule);border-radius:8px;min-height:560px;display:flex;flex-direction:column;overflow:hidden}
.workh{padding:15px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.workh h2{font-size:15.5px;font-weight:650}
.workh .wsub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:5px;line-height:1.6}
.workb{padding:20px;flex:1;overflow:hidden}
.empty{display:grid;place-items:center;text-align:center;padding:52px 20px}
.empty .eh{font-size:16px;font-weight:650;margin-bottom:8px}
.scen{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-top:22px;text-align:left;width:100%;max-width:760px}
.scenbtn{background:var(--raise);border:1px solid var(--rule);border-radius:8px;padding:14px 15px;cursor:pointer;text-align:left;transition:.12s}
.scenbtn:hover{border-color:var(--accent);box-shadow:var(--sh);transform:translateY(-1px)}
.scenbtn .sl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:7px}
.scenbtn .sn2{font-size:13px;font-weight:650;display:block;line-height:1.3}
.scenbtn .sd{font-size:11.8px;color:var(--ink-soft);margin-top:6px;display:block;line-height:1.45}

.runsplit{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;height:100%}

.ev.ok .dot{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.ev.warn .dot{background:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.ev.err .dot{background:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.ev.human .dot{background:var(--human);box-shadow:0 0 0 1px var(--human)}
.ev .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--agent);text-transform:uppercase}
.ev.human .who{color:var(--human)}
.ev .msg{font-size:12.6px;line-height:1.5;margin-top:2px}
.ev .det{font-size:11.5px;color:var(--ink-faint);margin-top:4px;line-height:1.5}
.ev .art{font-family:var(--mono);font-size:10.5px;background:var(--sunken);border:1px solid var(--rule-soft);border-radius:4px;padding:7px 9px;margin-top:7px;color:var(--ink-soft);white-space:pre-wrap;overflow-x:auto;line-height:1.55}
.ev .art b{color:var(--accent-ink);font-weight:500}
.tick{display:inline-block;width:9px;height:9px;border:1.5px solid var(--accent);border-radius:50%;border-top-color:transparent;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px}

.gapbox{background:var(--warn-wash);border:1px solid var(--warn);border-radius:7px;padding:13px 15px;margin-bottom:14px}
.gapbox h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--warn);margin:0 0 9px;font-weight:600}

.gapbox li{margin-bottom:5px}
.gapbox li::marker{color:var(--warn)}

.result.approved{background:var(--ok-wash);border-color:var(--ok)}

.speed{display:flex;gap:3px;align-items:center;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.speed button{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:3px 7px;cursor:pointer;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.speed button.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap}
.stepper div{flex:1;min-width:110px;border-top:2px solid var(--rule);padding:9px 12px 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.stepper div.on{border-top-color:var(--accent);color:var(--accent-ink)}
.stepper div.done{border-top-color:var(--ok);color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const VERDICT = { met:["MET","c-ok","ok"], partial:["PARTIAL","c-warn","warn"], gap:["GAP","c-bad","bad"] };
function reviewHTML(R, btnLabel, act){

    '<div class="confwrap"><div class="conf"><div class="kl mono tiny faint" style="letter-spacing:.13em;text-transform:uppercase">Packet confidence</div>'+
    '<div style="display:flex;gap:12px;align-items:baseline"><div style="font-size:26px;font-weight:700;letter-spacing:-.03em">'+pct(R.conf)+'</div><div class="tiny muted">'+esc(R.confLabel)+'</div></div>'+

  if(R.gaps && R.gaps.length){
    out.push('<div class="gapbox"><h4>Flagged before you approve</h4><ul>'+R.gaps.map(function(g){return "<li>"+esc(g)+"</li>";}).join("")+'</ul></div>');
  }

        '<div class="tiny faint mono" style="padding:11px 0 4px">evidence the policy asks for: '+esc(pc.need)+'</div>'+

    '<div class="card"><h3>What the agent could answer</h3><p class="muted tiny" style="margin:0">Two of the four criteria are now answerable with evidence that exists — one produced after submission, one that was always there but sat in a system the surgical practice is not connected to.</p></div>'+
    '<div class="card" style="border-color:var(--warn)"><h3>What it would not argue</h3><p class="muted tiny" style="margin:0">C1 is genuinely short: fourteen weeks of documented conservative care against a six-month requirement. The letter concedes it and argues the policy\'s own exception clause instead, because a letter that overclaims is worse than one that concedes.</p></div>'+
  '</div>'+
  '<div class="kick">Draft appeal letter — generated from the record, for a clinician to edit and sign</div>'+
  '<div class="letter">'+esc(s.letter)+'</div>'+
  '<div class="actionbar"><button class="btn" data-act="signappeal">Sign &amp; file appeal</button>'+
    '<button class="btn ghost" data-act="resetcase">Return to queue</button>'+
    '<span class="hint">A clinical assertion over a physician\'s name. A coordinator cannot approve this one, and no confidence score changes that.</span></div>'+
  collapsedLog();
}

/* ---------- playback engine ---------- */
function startScenario(k){
  stopTimer();
  D.sk = k; D.active = DB.scenarios[k].caseId; D.sel = D.active;
  D.events = []; D.facts = []; D.i = 0; D.open = {}; D.clock = 0; D.stage = "run";
  render(); setTimeout(playNext, 350);
}
function runPhase(stage){
  stopTimer(); D.stage = stage; D.i = 0; render(); setTimeout(playNext, 300);
}
function stopTimer(){ if(D.timer){ clearTimeout(D.timer); D.timer=null; } }
function fmtClock(ms){
  var t = ms/1000, m = Math.floor(t/60), s = (t%60).toFixed(1);
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function playNext(){
  var s = scenOf(); if(!s) return;
  var script = s[SCRIPT_OF[D.stage]];
  if(!script || D.i >= script.length){ finishPhase(); return; }
  var e = script[D.i++];
  D.clock += e.t;
  var ev = { a:e.a, lvl:e.lvl, m:e.m, d:e.d, art:e.art, ts:fmtClock(D.clock) };
  D.events.push(ev);
  if(e.fact){
    var found=false;
    D.facts.forEach(function(f,idx){ if(f[0]===e.fact[0]){ D.facts[idx]=e.fact; found=true; } });
    if(!found) D.facts.push(e.fact);
  }
  var tl = $("#tl");
  if(tl){
    var spin = $("#tlspin");
    var node = document.createElement("div"); node.innerHTML = evHTML(ev);
    tl.insertBefore(node.firstChild, spin);
    tl.scrollTop = tl.scrollHeight;
    var f = $("#facts"); if(f) f.outerHTML = factsHTML();
  }
  D.timer = setTimeout(playNext, Math.max(90, (script[D.i] ? script[D.i].t : 500) / D.speed));
}
function finishPhase(){
  stopTimer();
  D.stage = NEXT_STAGE[D.stage] || D.stage;
  render();
}
function skipPhase(){
  var s = scenOf(); if(!s) return;
  stopTimer();
  var script = s[SCRIPT_OF[D.stage]];
  if(script){ while(D.i < script.length){ var e=script[D.i++]; D.clock+=e.t;
    D.events.push({a:e.a,lvl:e.lvl,m:e.m,d:e.d,art:e.art,ts:fmtClock(D.clock)});
    if(e.fact){ var found=false; D.facts.forEach(function(f,i){ if(f[0]===e.fact[0]){D.facts[i]=e.fact;found=true;} }); if(!found) D.facts.push(e.fact); } } }
  finishPhase();
}
function resetCase(){ stopTimer(); D.active=null; D.sk=null; D.events=[]; D.facts=[]; D.stage="idle"; D.open={}; render(); }
function afterDemoRender(){ var tl=$("#tl"); if(tl) tl.scrollTop = tl.scrollHeight; }

/* =========================================================================
   EVENTS + BOOT
   ========================================================================= */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-route],[data-comp],[data-agent],[data-step],[data-jtab],[data-filter],[data-case],[data-scen],[data-act],[data-speed],[data-critbtn]");
  if(!t) return;
  var d = t.dataset;

  if(d.act){
    if(d.act==="start")       { startScenario(d.scen); return; }
    if(d.act==="approve")     { runPhase("submit"); return; }
    if(d.act==="approve2")    { runPhase("rfiSubmit"); return; }
    if(d.act==="runrfi")      { runPhase("rfi"); return; }
    if(d.act==="runappeal")   { runPhase("appeal"); return; }
    if(d.act==="signappeal")  { runPhase("appealSubmit"); return; }
    if(d.act==="skip")        { skipPhase(); return; }
    if(d.act==="resetcase")   { resetCase(); return; }
  }
  if(d.speed!=null){ D.speed = Number(d.speed); $("#topright").innerHTML = demoTopRight(); return; }
  if(d.critbtn!=null){ var box=t.closest(".crit"); box.classList.toggle("open"); D.open[d.critbtn]=box.classList.contains("open"); return; }
  if(d.scen && !d.act){ startScenario(d.scen); return; }
  if(d.case){ if(D.active && D.active!==d.case) resetCase(); D.sel=d.case; render(); return; }
  if(d.filter){ S.qFilter=d.filter; render(); return; }
  if(d.jtab!=null){ S.jTab=Number(d.jtab); render(); return; }
  if(d.step){ stepPanel(d.step); return; }
  if(d.agent){ agentPanel(d.agent); return; }
  if(d.comp){
    document.querySelectorAll(".comp.sel").forEach(function(e){e.classList.remove("sel");});
    t.classList.add("sel"); compPanel(d.comp); return;
  }
  if(d.route){ go(d.route); return; }
});
$("#panelClose").addEventListener("click", closePanel);
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closePanel(); });
$("#themebtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur==="dark" ? "light" : cur==="light" ? "" : "dark";
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("pa-theme", next); }catch(err){}
});
try{ var th = localStorage.getItem("pa-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(err){}

/* deep link: #demo/<scenario>/<stage> jumps straight to a stage with the log pre-played.
   Useful when the review call is short and you want the review screen without waiting. */
const CHAIN = {
  approved:["run","review","submit","result"],
  pended:["run","review","submit","result","rfi","review2","rfiSubmit","result2"],
  denied:["run","review","submit","result","appeal","letter","appealSubmit","result3"]
};
function jumpTo(k, stage){
  var s = DB.scenarios[k], chain = CHAIN[k];
  if(!s || chain.indexOf(stage)<0) return false;
  stopTimer();
  D.sk=k; D.active=s.caseId; D.sel=s.caseId; D.events=[]; D.facts=[]; D.clock=0; D.i=0; D.open={};
  for(var i=0;i<chain.length;i++){
    var st = chain[i];
    if(st===stage) break;
    var scr = s[SCRIPT_OF[st]];
    if(scr) scr.forEach(function(e){
      D.clock+=e.t; D.events.push({a:e.a,lvl:e.lvl,m:e.m,d:e.d,art:e.art,ts:fmtClock(D.clock)});
      if(e.fact){ var f=false; D.facts.forEach(function(x,j){ if(x[0]===e.fact[0]){D.facts[j]=e.fact;f=true;} }); if(!f) D.facts.push(e.fact); }
    });
  }
  D.stage = stage; S.route = "demo"; D.i = 0;
  return true;
}
function applyHash(initial){
  var h = location.hash.slice(1);
  if(!h) return;
  var parts = h.split("/");
  if(parts[0]==="demo" && parts.length===3){
    if(jumpTo(parts[1], parts[2])){
      buildNav(); if(!initial) render();
      if(PLAYING[D.stage]) setTimeout(function(){ if(!initial) {} else render(); playNext(); }, 500);
      return;
    }
  }
  if(ROUTES.some(function(r){return r.id===parts[0];})){
    if(initial) S.route = parts[0]; else go(parts[0]);
  }
}
window.addEventListener("hashchange", function(){ applyHash(false); });
applyHash(true);
buildNav(); render();
